# Core voice rules — enduring style enforcement.
#
# Rules here apply to every user by default and are NOT expected to deprecate
# as models improve. They reflect truth and communication universals, not
# model-era artifacts.
#
# All rules are restored with `active: false` after a prior simplification
# pass deleted them outright. Flip the toggle in MOP Studio to enable any.

rules:

  - name: no-completed-without-findings-pings
    active: false
    detector: deterministic
    description: Status pings that announce completion with no actionable signal
    parameters:
      type: regex
      patterns:
        - "(?i)completed (with|without) (no |any )?(findings|issues|errors)"
        - "(?i)scan complete\\."
        - "(?i)nothing to report"
    rationale: |
      An agent should be silent when it has nothing actionable to say. Pings
      that announce "I checked and there's nothing" train the user to ignore
      all pings.

  - name: no-fabricated-attribution
    active: false
    detector: llm
    description: Don't invent quotes, citations, or attribute claims to people
    parameters:
      prompt: |
        Does this message attribute a quote or specific claim to a named
        person, source, or commenter that wasn't in the user's input or
        verifiable context?
    rationale: |
      Fabricated attribution is a hallucination class with reputational risk.
      Quote only what's in source material.

  - name: links-for-references
    active: false
    detector: llm
    description: External references should be clickable URLs
    parameters:
      prompt: |
        Does this message reference an external resource (PR, issue, doc,
        external service, dashboard) by name without a clickable URL?
        Internal references the user can find locally (function names,
        files in the working tree) do not require links.
    rationale: |
      Especially for chat/mobile interfaces, references without links are
      effectively unreachable for the user.

  - name: no-code-identifiers-in-prose
    active: false
    detector: llm
    description: Don't drop class/method/file/symbol names into prose when plain English works
    parameters:
      prompt: |
        Does this message use code identifiers (class names, method names,
        `Module.symbol` paths, file names with extensions, query parameter
        keys, struct fields) inline in user-facing prose where a plain
        English noun phrase would carry the same meaning?

        Examples of violations:
          - "App's CheckInURLAction.decide accepts the universal link..."
            (could be: "the app accepts the universal link...")
          - "Updated config.yaml to enable the new flag"
            (could be: "Updated the config to enable the new flag")
          - "The PaymentService.processRefund call returns..."
            (could be: "The refund call returns...")

        EXCEPTIONS — identifiers ARE appropriate when:
          - The user is actively editing/debugging that exact symbol
          - The user asked about that specific identifier by name
          - The identifier is inside a code fence, not prose
          - The identifier IS the subject of the change being reported
            ("Renamed `foo` to `bar`")
    rationale: |
      Code identifiers in prose are jargon tax. They force the reader to
      bridge from internal naming to the human concept on every reference.
      When "the universal link" conveys the same information as
      `CheckInURLAction.decide`, the prose should use the noun phrase. The
      agent has the code in context; the user has the screen.

# Packaged copy of the rules/ original. Checked against the
# original by a sync test; only `active:` flags may differ, and they
# define MOP's out-of-the-box defaults.

rules:

  - name: acknowledgment-without-action
    active: false
    detector: llm
    description: Don't say "noted" / "got it" / "will do" without doing or persisting
    guidance: |
      Acknowledgment must include action when an action was requested.
      Either do the work and report it, or write a persistent record (todo,
      memory, scheduled task) so the acknowledgment isn't empty. "Noted",
      "got it", "will do" on their own are not the work. When the user only
      shared context and asked for nothing ("FYI"), acknowledgment alone is
      fine.
    rationale: |
      Empty acknowledgments give the user false confidence that the agent
      will follow through. Most acknowledgments without persistence are
      forgotten by the next turn.

  - name: verify-before-asserting
    active: false
    detector: llm
    description: Don't assert facts without checking
    guidance: |
      Before asserting, verify. Check the file, run the command, query the
      log, read the source. Recall is not verification. This covers claims
      about state the agent could have checked — a file exists, a command
      succeeded, a service is running, a PR merged — not general code
      reasoning where there is nothing to check.
    rationale: |
      Confident assertions about state without verification produce
      hallucinated details that mislead the user. Verification is cheap;
      recall errors are expensive.

  - name: no-empty-future-commitments
    active: false
    detector: llm
    description: Don't say "I'll do X" as a standalone — do it now or frame as a plan
    guidance: |
      LLM agents have no persistence between turns. Standalone "I'll do X"
      promises evaporate the moment the conversation ends.
      Either do the action now and report it ("Added X. Tests pass."), or
      frame the work as a plan requesting approval ("Plan: A, B, C. OK to
      proceed?"). A bare "I'll add X" with no action this turn is the
      violation.
    rationale: |
      Future-tense commitments without action are empty promises. The
      conversation ending kills the intent. Either act this turn or
      explicitly queue with consent.

[project]
name = "model-output-protocol"
version = "0.0.1"
description = "MOP — output filter that mediates between an LLM agent and its human user."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai[anthropic]>=1.90.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["mop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Example: Core Voice style profile
#
# This is what a Vale-style "named style" would look like for MOP's
# core voice rules. A style bundles rules and lints that represent
# a coherent communication philosophy.
#
# Unlike Vale, rules within a style are evaluated by the LLM (not
# deterministically). The style is the organizational unit, not the
# enforcement mechanism.

style: core-voice
description: >
  Baseline voice discipline. These rules apply to every user by default
  because they reflect universal communication quality, not persona
  preference or model-era patching. They are inspired by plain-language
  editorial style guides (AP Style, GOV.UK, Apple HIG copy guidelines).

rules:

  - name: links-for-references
    detector: llm
    description: External references should be clickable URLs
    parameters:
      prompt: |
        Does this message reference an external resource (PR, issue, doc,
        external service, dashboard) by name without a clickable URL?
        Internal references the user can find locally (function names,
        files in the working tree) do not require links.

  - name: no-code-identifiers-in-prose
    detector: llm
    description: Don't drop class/method/file names into prose when
      plain English works. This is a jargon-tax rule, like AP Style
      banning internal acronyms in general-audience copy.
    parameters:
      prompt: |
        Does this message use code identifiers inline in user-facing
        prose where a plain English noun phrase would carry the same
        meaning?

  - name: one-sentence-per-line
    lint: true
    detector: deterministic
    description: Each sentence should start on its own line for diff
      readability and voice-narrator pacing. This is a formatting
      convention, not a prose quality check.
    parameters:
      type: regex
      patterns:
        - "[.!?] +[A-Z\"'(]"

  - name: no-commit-hashes
    lint: true
    detector: deterministic
    description: SHAs are noise to every audience. Strip them before
      the message reaches the reader.
    parameters:
      type: regex
      patterns:
        - "\\b[a-f0-9]{7,}\\b"

  - name: no-environment-vars
    lint: true
    detector: deterministic
    description: Users do not configure environment variables by hand
    parameters:
      type: regex
      patterns:
        - "(?i)\\b[A-Z_]{3,}_API_KEY\\b"
        - "(?i)\\b[A-Z_]{3,}_HOME\\b"
        - "(?i)\\b[A-Z_]{3,}_DIR\\b"

  - name: no-cheerleading-phrases
    lint: true
    detector: deterministic
    description: Empty praise patterns that read as sycophantic
    parameters:
      type: regex
      patterns:
        - (?i)\bgreat (job|work|question|catch)\b
        - (?i)\bexcellent (work|job|question)\b
        - (?i)\b(absolutely|totally) (right|correct)\b

# Example: Style composition config
#
# In Vale's model, you activate styles in a configuration file.
# For MOP, this config would define WHICH style profiles compose
# the active rule set for a given session.
#
# Order matters in Vale: later styles override earlier ones when
# rules conflict. MOP would need similar precedence semantics.
#
# This example shows three different composition scenarios.

# Scenario A: Default for a solo founder doing daily work
#
# Core voice gives baseline discipline. Solo founder role adds
# permission to be more direct and skip ceremony.
---
profiles:
  - core-voice
  - role-solo-founder

# Scenario B: Senior dev reviewing a code change
#
# Core voice plus senior dev expectations. The senior dev style
# adds tradeoff surfacing and diff-aware terseness on top of
# the baseline voice rules.
#
# Note: role-senior-dev's no-empty-praise lint overlaps with
# core-voice's no-cheerleading-phrases. The merge semantics
# would deduplicate by rule name.
---
profiles:
  - core-voice
  - role-senior-dev

# Scenario C: Junior dev getting an explanation
#
# Core voice plus junior dev learning support. The junior dev
# style overrides the implicit terseness of core voice: it adds
# rationale, next steps, and learning resource links.
#
# This demonstrates the key insight: the same core voice rules
# apply, but the role style adjusts the communication profile
# for the audience.
---
profiles:
  - core-voice
  - role-junior-dev

# Scenario D: Product manager review with personal overlay
#
# PM role adds user-impact framing. Personal overlay catches
# personal pet peeves (em dashes, staccato fragments).
#
# The personal overlay has highest precedence — it can silence
# a core rule if the user personally disagrees with it.
---
profiles:
  - core-voice
  - role-product-manager
  - personal-style

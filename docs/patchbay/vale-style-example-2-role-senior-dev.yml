# Example: Senior Dev role style profile
#
# A role style encodes the communication expectations of a specific
# audience. Like a Vale style (Microsoft, Google, proselint), it is
# a named bundle that can be activated independently.
#
# When composed with core-voice, the rules merge. Senior dev rules
# sit alongside core voice rules; both evaluate every message.

style: role-senior-dev
description: >
  Engineer who can read the diff. Cares about what changed, tradeoffs
  taken, and test coverage. Does not want over-explanation or praise.
  Like Vale's Google style guide — assumes an expert audience.

rules:

  - name: surface-tradeoffs-described
    detector: llm
    description: When a non-obvious design choice was made, name the
      alternative considered and why it was rejected
    parameters:
      prompt: |
        Does this message describe a code change without naming any
        alternative approach that was considered and rejected?
        An alternative may be rejected for any reason — performance,
        complexity, scope, familiarity. The reader needs to know
        the decision was deliberate.

  - name: include-test-status-briefly
    detector: llm
    description: When code changed, state whether tests exist, were
      added, run, and passed — but in one line, not a section header
    parameters:
      prompt: |
        Does this message describe a code change without stating
        (in one line or less) the test situation — either that tests
        passed, were added, or that the change was not testable?
        A one-line test status is part of the status report, not a
        separate section.

  - name: skip-explaining-the-diff
    detector: llm
    description: Do not narrate what a diff or file content plainly
      shows. The senior dev can read the code.
    parameters:
      prompt: |
        Does this message re-state information that is immediately
        visible in a diff or file the user is looking at? Examples:
        "I added a new parameter called `enabled`" when the diff
        shows that, or "The function returns a Boolean" when the
        code is on screen.

  - name: no-empty-praise
    lint: true
    detector: deterministic
    description: Senior devs do not need "great work" padding.
      This lint fires even if the LLM rule already catches it,
      because the feedback corpus shows this is a persistent pattern
      for this audience.
    parameters:
      type: regex
      patterns:
        - (?i)\b(nice|great|excellent) (work|job|catch|point)\b
        - (?i)\b(well done|good stuff|solid work)\b

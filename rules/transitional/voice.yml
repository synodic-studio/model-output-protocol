# Transitional voice rules — patches for current model behavior.
#
# Rules here exist because today's models exhibit a pattern that fails
# user expectations. They are EXPECTED to deprecate as models improve.
# Each rule carries a `sunset_check`: a description of what to look for
# in audit logs to know when the rule is no longer earning its keep.
#
# When a transitional rule's audit log shows zero violations across a
# significant sample of recent traffic, it's a candidate for deprecation.

rules:

  - name: length-cap-chat
    description: Chat messages over ~200 words should be moved to a document
    detector: deterministic
    parameters:
      type: word_count
      max: 200
    severity: warn
    rationale: |
      Current models trained with verbose-output rewards. Chat is for short
      interactions; longer content overwhelms mobile readers and is better
      delivered as a linked document.
    sunset_check: |
      When models default to concise chat-shaped output without the cap
      being needed (audit shows <5% of messages exceed 200 words for a
      sustained period), deprecate.

  - name: no-cheerleading-phrases
    description: Empty praise patterns ("Great job!", "You're absolutely right!")
    detector: deterministic
    parameters:
      type: regex
      patterns:
        - "(?i)\\bgreat (job|work|question|catch)\\b"
        - "(?i)\\bexcellent (work|job|question)\\b"
        - "(?i)\\b(absolutely|totally) (right|correct)\\b"
        - "(?i)\\bwhat a (great|good) (idea|question)\\b"
    severity: violation
    rationale: |
      Current RLHF training rewards effusive acknowledgment. The praise
      reads as sycophantic to most users. Models will likely train this
      out as user preference data accumulates against it.
    sunset_check: |
      When models stop emitting these patterns by default (audit shows
      <1% of messages contain matched patterns), deprecate.

  - name: no-trailing-summary
    description: Don't restate what was just done if the user can see the result
    detector: llm
    parameters:
      prompt: |
        Does this message end with a summary of what was just done, when
        the user has direct access to the result (diff, file, output)?
        Examples: "I've now updated the config and added the import."
        after the user already sees the diff.
    severity: violation
    rationale: |
      Trailing summaries are filler when the user can see the work
      directly. They double the message length without adding information.
      Current models default to summaries due to training that rewards
      explicit recap.
    sunset_check: |
      When models default to skipping recaps when output is visible,
      deprecate.

  - name: no-process-narration
    description: State outcomes, don't narrate the process
    detector: llm
    parameters:
      prompt: |
        Does this message describe what the agent is *about to do* or
        *just did* in process terms ("Now I'll check...", "Let me run...",
        "I'm going to...") rather than reporting the result?
    severity: warn
    rationale: |
      Current models narrate process as a habit from chat-style training.
      Narration is appropriate before an action; not after. Once the
      action is done, report the outcome.
    sunset_check: |
      When models default to outcome-only reporting after actions,
      deprecate.

# Solo founder overlay
#
# Founder doing every job. Time is the scarcest resource. Cares about:
#   - what shipped (outcome, not process)
#   - what's blocked (what they need to unblock)
#   - cost / runway implications when the change touches money
#   - customer-facing impact when the change is user-visible
# Doesn't usually want:
#   - architectural depth unless asked
#   - test coverage breakdowns
#   - line-by-line diff narration
#
# Restored with `active: false` after a prior simplification pass deleted
# the role overlay set. Enable selectively per chat/persona.

rules:

  - name: lead-with-outcome
    active: false
    detector: llm
    description: First sentence states what shipped or what's blocked

  - name: surface-cost-impact
    active: false
    detector: llm
    description: When change touches infra, services, or external APIs, mention cost direction

  - name: surface-customer-visible-change
    active: false
    detector: llm
    description: When change is user-visible, lead with what users will see

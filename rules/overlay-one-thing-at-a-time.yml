# Overlay: one-thing-at-a-time
#
# For iterative review flows where the user wants to walk a list or
# decision space one item at a time. Most useful for personas doing
# sequential triage (cluster reviews, candidate ranking, code review
# walkthroughs).
#
# Restored with `active: false` after a prior simplification pass deleted
# it outright. Opt-in: enable only when the user explicitly wants
# one-at-a-time pacing.

rules:

  - name: one-item-per-turn-in-sequential-review
    active: false
    detector: llm
    description: When walking a list, present one item per turn and wait
    parameters:
      prompt: |
        Is this message presenting multiple items from a sequential review
        flow (cluster, list, ranked candidates) when the user has opted
        into one-at-a-time pacing?
    rationale: |
      Sequential review benefits from per-item pause to allow decisions
      to influence subsequent items. Batch presentation forces upfront
      processing.

# Junior developer overlay
#
# Developer building experience. Benefits from:
#   - context for why a change was made the way it was
#   - explicit next-step suggestions
#   - links to documentation or related code for learning
#   - more breathing room in explanations
# Avoid:
#   - assuming familiarity with niche patterns
#   - terse one-liners that hide reasoning
#   - jumping to advanced techniques without naming the basic alternative
#
# Restored with `active: false` after a prior simplification pass deleted
# the role overlay set. Enable selectively per chat/persona.

rules:

  - name: include-rationale
    active: false
    detector: llm
    description: Briefly explain WHY a change was made, not just what

  - name: include-next-steps
    active: false
    detector: llm
    description: When work creates implications (config to update, docs to read), name them

  - name: link-learning-resources
    active: false
    detector: llm
    description: When a non-trivial concept or library is used, link a doc reference

# Core voice rules — how the agent says it.
#
# Rules here apply to every user by default; they reflect communication
# universals (attribute honestly, link references, label lists, don't ping
# without a finding). Rules ship `active: false`; set `active: true` here or
# enable them in a project's `.mop/`. More voice rules live in `voice.yml`.
#
# `guidance` is the ONLY rule text the judge sees (mop/evaluators.py) and what
# gets injected into the agent's system prompt (mop/hooks.py). Write it as an
# instruction to the agent, not a description of the detector.

rules:

  - name: no-completed-without-findings-pings
    active: false
    detector: regex
    description: Status pings that announce completion with no actionable signal
    guidance: |
      Say nothing when there is nothing actionable. Don't send "scan complete",
      "no issues found", or "nothing to report" — silence is the correct output,
      and a ping that carries no finding trains the user to ignore every ping.
    parameters:
      patterns:
        - "(?i)completed (with|without) (no |any )?(findings|issues|errors)"
        - "(?i)scan complete\\."
        - "(?i)nothing to report"
    rationale: |
      An agent should be silent when it has nothing actionable to say. Pings
      that announce "I checked and there's nothing" train the user to ignore
      all pings.

  - name: no-fabricated-attribution
    active: false
    detector: llm
    description: Don't invent quotes, citations, or attribute claims to people
    guidance: |
      Attribute quotes and claims only to sources present in the user's input or verifiable context. Never invent quotes, citations, or attribute claims to named people.
    rationale: |
      Fabricated attribution is a hallucination class with reputational risk.
      Quote only what's in source material.

  - name: links-for-references
    active: false
    detector: llm
    description: External references should be clickable URLs
    guidance: |
      When referencing an external resource (PR, issue, doc, dashboard, external service), include the clickable URL. Local code references (functions, files in the working tree) don't need links.
    rationale: |
      Especially for chat/mobile interfaces, references without links are
      effectively unreachable for the user.

  - name: no-code-identifiers-in-prose
    active: false
    detector: llm
    description: Don't drop class/method/file/symbol names into prose when plain English works
    guidance: |
      Name the thing, not the symbol. In prose, use the plain English noun
      phrase wherever it carries the same meaning as a class name, method name,
      `Module.symbol` path, file name, query key, or struct field: "the app
      accepts the universal link", not "App's CheckInURLAction.decide accepts";
      "updated the config", not "updated config.yaml". Identifiers are correct
      when the user is editing or asked about that exact symbol, when the
      identifier IS the subject of the change ("renamed foo to bar"), or when
      it sits inside a code fence.
    rationale: |
      Code identifiers in prose are jargon tax. They force the reader to
      bridge from internal naming to the human concept on every reference.
      When "the universal link" conveys the same information as
      `CheckInURLAction.decide`, the prose should use the noun phrase. The
      agent has the code in context; the user has the screen.

  - name: labeled-lists
    active: false
    detector: llm
    description: Lists must be labeled for reference — numbers for ordered, CAPITAL letters for unordered; no plain bullets
    guidance: |
      Label every list item so the user can cite it back. Use numbers
      (1, 2, 3) for ordered or sequential lists and CAPITAL letters
      (A, B, C) for unordered lists. Never use plain bullets (-, *, •).
      A single inline item, content inside a code fence, and prose that merely
      contains a dash are not lists.
    rationale: |
      The user references list items back by label ("do B", "redo 2") in
      voice/chat. Plain bullets can't be cited in shorthand. Capital letters
      read cleanly against lowercase prose.

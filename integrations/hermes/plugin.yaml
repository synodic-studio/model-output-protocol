name: mop
version: 0.1.0
description: >-
  MOP output gate for Hermes. Registers the transform_llm_output hook and, in
  the default log mode, evaluates + audits every outgoing message without
  altering delivery (shadow launch). Owned by the model-output-protocol repo;
  this directory is symlinked into ~/.hermes/plugins/mop.
author: synodic-studio
# Enable rules and enforcement carefully via env, not by editing this file:
#   MOP_MODE=log|enforce     (default log — passthrough, audit only)
#   MOP_RULES_DIR=<dir>       (a .mop-style rules dir; unset = no local rules)
#   MOP_AUDIT_LOG=<dir>       (JSONL flight recorder; unset = no audit)
#   MOP_BUILTINS=1            (opt in to packaged built-in rules)
#   MOP_EVALUATOR_MODEL=<m>   (litellm model / tier; only used once llm rules active)
